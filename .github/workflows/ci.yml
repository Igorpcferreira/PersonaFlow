name: CI local simulated MVP

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: personaflow_test
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: personaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personaflow_test -d personaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://personaflow_test:ci-only-placeholder@127.0.0.1:5432/personaflow_test
      DATABASE_URL: postgresql://personaflow_test:ci-only-placeholder@127.0.0.1:5432/personaflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:browser:install
      - run: npm run test:e2e
      - run: npm run build
